---
# Home Assistant add-on base images per architecture.
#
# NOTE: the Go bridge is part of the parent Go module at the repository root, so
# this image must be built with the REPOSITORY ROOT as the Docker build context
# (the Dockerfile COPYs go.mod, internal/ and cmd/). See DOCS.md "Building".
build_from:
  amd64: ghcr.io/home-assistant/amd64-base:latest
  aarch64: ghcr.io/home-assistant/aarch64-base:latest
  armv7: ghcr.io/home-assistant/armv7-base:latest
args:
  GO2RTC_VERSION: "1.9.4"
labels:
  org.opencontainers.image.source: "https://github.com/local/motorola-vm65-bridge"
