# Compose the vm65-bridge tunnel with go2rtc.
#
#   1. Put your credentials in ./creds.json (see creds.example.json). Never
#      commit it: the repo .gitignore already excludes runtime-logs, keep this
#      file out of git too.
#   2. Fill the placeholders in go2rtc.yaml with the RTSP user/password and
#      accessToken.
#   3. docker compose up --build
#
# go2rtc's web UI is then on http://localhost:1984 and the stream is named
# "vm65".
#
# Generate current credentials with vm65-setup before starting this manual
# single-camera example. The Home Assistant add-on automates that lifecycle.

services:
  bridge:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["-listen", "0.0.0.0:8554", "-status", "0.0.0.0:8555", "-creds", "/data/creds.json"]
    volumes:
      - ./creds.json:/data/creds.json:ro
    expose:
      - "8554"
    healthcheck:
      # Static binary on scratch has no shell; rely on go2rtc's stream retry
      # instead. The /status endpoint is available for external monitoring.
      disable: true
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    depends_on:
      - bridge
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"   # web UI / API
      - "8555:8555"   # go2rtc RTSP republish (host port -> container 8555)
      - "8556:8556"   # webrtc
    restart: unless-stopped
