name: Motorola Nursery Homeassistant Bridge
version: "0.11.0"
slug: vm65_bridge
image: ghcr.io/paradox101/{arch}-motorola-nursery-homeassistant-bridge
description: Publishes compatible Motorola Nursery cameras through Magic WEB2 and optional go2rtc.
url: https://github.com/Paradox101/motorola-babycam-ha-bridge
arch:
  # 32-bit targets are deliberately absent: Home Assistant publishes no base
  # image newer than Alpine 3.22 for armv7 or armhf, so offering those would
  # pin the whole add-on — ffmpeg included — to a base that no longer gets
  # security updates.
  - amd64
  - aarch64
# The MQTT image entity this add-on publishes reads its URL from a topic, which
# Home Assistant's MQTT integration has supported since 2023.7.
homeassistant: "2023.7.0"
init: false
startup: application
# A nursery camera bridge that does not come back after a Home Assistant
# restart is a bridge nobody notices is gone until they need it.
boot: auto
# The Web UI is served through Home Assistant Ingress. A webui: link built from
# [HOST]:[PORT:1984] only resolves on the local network over plain http, so it
# breaks for anyone reaching Home Assistant through a domain name, a reverse
# proxy or Nabu Casa. Ingress serves the same page on whatever host and scheme
# the browser already uses, with Home Assistant's own authentication.
#
# Ingress points at the bridge, not at go2rtc. go2rtc has no authentication of
# its own: its API hands out the generated configuration — RTSP password and
# camera access token included — and builds a stream from any source it is
# given, "exec:" among them. The bridge checks the Supervisor's ingress user
# header before proxying anything to it, and go2rtc itself stays on container
# loopback.
ingress: true
ingress_port: 8099
# The Web UI serves two responses that never end: the MJPEG fallback transport
# and progressive fMP4. The Supervisor buffers an ingress response unless this
# is set, which would hold both open forever and deliver nothing — and MJPEG is
# exactly the transport that matters when the page is reached through Nabu Casa
# or a reverse proxy, where WebRTC media cannot arrive at all.
ingress_stream: true
panel_icon: mdi:baby-face-outline
# Only administrators see the sidebar panel.
panel_admin: true
# Only the media ports leave the container. Everything Home Assistant itself
# uses — the Web UI, snapshots and the watchdog — travels over the internal
# Supervisor network, so it needs no host port at all. go2rtc's own API is not
# listed: it binds container loopback and is reachable only through the
# authenticated proxy above.
ports:
  8099/tcp: null
  8555/tcp: 8555
  8556/tcp: 8556
  8556/udp: 8556
  8557/tcp: null
ports_description:
  8099/tcp: Web UI and camera snapshots; served through Ingress, leave unset
  8555/tcp: go2rtc RTSP republish
  8556/tcp: WebRTC (TCP)
  8556/udp: WebRTC (UDP)
  8557/tcp: Bridge health endpoint, polled internally by the watchdog
# A literal container port keeps the watchdog working over the Supervisor
# network; [PORT:8557] would resolve to a host mapping that no longer exists.
watchdog: "http://[HOST]:8557/healthz"
services:
  - mqtt:want
options:
  email: ""
  otp_code: ""
  control_host: "vrelay-de0.5gen.care"
  stream_backend: bundled
  mqtt_discovery: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_tls: false
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: homeassistant
  temperature_poll_interval: 30
  camera_refresh_interval: 60
  stream_host: homeassistant.local
  # The host ports the two media services are reachable on. They default to the
  # container ports below, which is what the Network section maps them to unless
  # someone changes it; change these to match whenever that mapping changes,
  # because these are the numbers that end up in the RTSP URL Home Assistant is
  # told to use and in the WebRTC candidate the browser is told to connect to.
  rtsp_port: 8555
  webrtc_port: 8556
  external_stream_port: 0
  shutdown_timeout: 10
  credential_refresh_interval: 21600
schema:
  email: str
  otp_code: password
  control_host: str
  stream_backend: list(bundled|external)
  mqtt_discovery: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_tls: bool
  mqtt_username: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  temperature_poll_interval: int(10,3600)
  camera_refresh_interval: int(0,3600)
  stream_host: str
  rtsp_port: port
  webrtc_port: port
  external_stream_port: int(0,65535)
  shutdown_timeout: int(1,120)
  credential_refresh_interval: int(300,86400)
