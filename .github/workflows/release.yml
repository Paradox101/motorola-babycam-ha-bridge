name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Require an annotated tag
        shell: bash
        # actions/checkout peels the tag while checking out its target commit.
        # Ask the remote for the peeled ref instead: it exists only for an
        # annotated tag and cannot be altered by the checkout step.
        run: git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}^{}" | grep -q .
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate release contract
        run: python tools/ci/check_release.py "${GITHUB_REF_NAME}"
      - name: Test
        run: go test ./...
      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          version_flag="-X github.com/local/motorola-vm65-bridge/internal/buildinfo.Version=${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w $version_flag" -o "dist/vm65-bridge-linux-$arch" ./cmd/vm65-bridge
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w $version_flag" -o "dist/vm65-setup-linux-$arch" ./cmd/vm65-setup
          done
          ./dist/vm65-bridge-linux-amd64 -version
          cd dist
          sha256sum vm65-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
