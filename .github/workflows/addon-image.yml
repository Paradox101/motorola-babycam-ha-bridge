name: Add-on image

# Publishes the add-on image so installing it is a pull instead of a build.
#
# Without a published image the Supervisor builds the add-on on the user's own
# machine: pull a Go toolchain, clone this repository, reach the module proxy
# and compile two binaries — on a Raspberry Pi, under emulation when the
# architectures do not match. That is minutes of installation time that fails
# whenever GitHub, the module proxy or Docker Hub is briefly unreachable.
#
# The image is not referenced from config.yaml yet. Setting `image:` there
# points every installation at this registry, so it is only worth doing once
# tags exist here for both architectures; docs/releases.md carries that step.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: false
        default: release

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The add-on version, not the tag: it is what the Supervisor compares
      # against the installed version, and what the built binaries report.
      - name: Read the add-on version
        id: addon
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' homeassistant/vm65-bridge/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # One image per architecture, named the way the Supervisor expects when
      # config.yaml carries an `image:` with the {arch} placeholder.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: homeassistant/vm65-bridge
          file: homeassistant/vm65-bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            SOURCE_REF=${{ inputs.ref || github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-vm65-bridge:${{ steps.addon.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-vm65-bridge:latest
