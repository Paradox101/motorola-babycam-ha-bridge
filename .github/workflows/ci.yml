name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  STATICCHECK_VERSION: "2026.2.1"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  quality:
    name: formatting / vet / policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
      - name: Staticcheck
        run: staticcheck ./...
      - name: Verify the module graph is tidy
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi
      - name: Scan dependencies for known vulnerabilities
        # govulncheck type-checks the sources, so it must be built with a
        # toolchain at least as new as the module's go directive.
        env:
          GOTOOLCHAIN: go${{ env.GO_VERSION }}
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - name: Install metadata validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test add-on validator
        run: python -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Validate add-on metadata
        run: python tools/ci/check_addon.py
      - name: Enforce repository policy
        shell: pwsh
        run: ./tools/ci/check-repository.ps1

  test:
    name: race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race ./...

  crosscompile:
    name: linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build production commands
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/vm65-bridge-linux-${GOARCH} ./cmd/vm65-bridge
          go build -trimpath -ldflags="-s -w" -o dist/vm65-setup-linux-${GOARCH} ./cmd/vm65-setup
      - uses: actions/upload-artifact@v4
        with:
          name: nursery-bridge-linux-${{ matrix.goarch }}
          path: dist/*

  shell:
    name: add-on shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck bats
      - run: shellcheck homeassistant/vm65-bridge/run.sh
      - run: bats homeassistant/vm65-bridge/tests/run.bats

  addon:
    name: add-on image / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The add-on image is the one users actually install, and it is not the
      # image the job below builds: it has its own base, its own ffmpeg and its
      # own clone of this repository. Building it from the branch under test is
      # what keeps a break in it from reaching an installation first.
      - name: Build the add-on image without publishing
        uses: docker/build-push-action@v6
        with:
          context: homeassistant/vm65-bridge
          file: homeassistant/vm65-bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            SOURCE_REF=${{ github.head_ref || github.ref_name }}
          tags: motorola-nursery-addon:ci-${{ matrix.arch }}

  docker:
    name: container / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: motorola-nursery-bridge:ci-${{ matrix.tag }}
